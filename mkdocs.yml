# ------------------------------------------------------------
# 额外配置
# ------------------------------------------------------------
extra:
  # 社交链接
  social:
    - icon: fontawesome/brands/github
      link: https://github.com
      name: GitHub
  # 版本信息
  version:
    provider: mike
